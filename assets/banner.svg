<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="phoneBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .badge-pill {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
    }
    .metric-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .metric-value {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 19px;
      fill: #f1f5f9;
    }

    /* Ambient Pulsing Background Elements */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.65; }
    }
    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 950px 140px;
    }
    .orb-2 {
      animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
      transform-origin: 150px 220px;
    }

    /* Floating Phone Mockup Animation */
    @keyframes floatMockup {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(0.8deg); }
    }
    .floating-phone {
      animation: floatMockup 6s ease-in-out infinite;
    }

    /* Dynamic Data Wave & Pulse */
    @keyframes dashCycle {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    .animated-pulse-line {
      stroke-dasharray: 10, 8;
      animation: dashCycle 25s linear infinite;
    }

    /* Floating Pill Badge */
    @keyframes bobPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .floating-chip {
      animation: bobPill 4.5s ease-in-out infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGradient)" />

  <!-- Grid Overlay for Tech feel -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="68" x2="1200" y2="68" />
    <line x1="0" y1="136" x2="1200" y2="136" />
    <line x1="0" y1="204" x2="1200" y2="204" />
    <line x1="0" y1="272" x2="1200" y2="272" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="800" y1="0" x2="800" y2="340" />
    <line x1="1000" y1="0" x2="1000" y2="340" />
  </g>

  <!-- Glowing Ambient Blobs (Deep Background) -->
  <circle class="orb-1" cx="980" cy="150" r="140" fill="#6366f1" filter="url(#glow)" />
  <circle class="orb-2" cx="120" cy="240" r="110" fill="#0ea5e9" filter="url(#glow)" />

  <!-- Animated Data Flow Connections in Background -->
  <path class="animated-pulse-line" d="M 820 180 C 890 130, 930 250, 1020 170" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" />
  <path class="animated-pulse-line" d="M 850 240 C 920 290, 960 170, 1060 210" fill="none" stroke="#c084fc" stroke-opacity="0.35" stroke-width="2" />

  <!-- Left Content: High Contrast & Foreground -->
  <g transform="translate(60, 48)">
    <!-- Category Capsule Badge -->
    <g class="floating-chip">
      <rect x="0" y="0" width="230" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" filter="url(#softGlow)" />
      <text x="30" y="20" class="badge-pill">MOBILE-FIRST CRM ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" class="title-text">Awesome Mobile CRM</text>
    <rect x="0" y="94" width="90" height="4" rx="2" fill="url(#accentGradient)" />

    <!-- Subtitle & Value Prop -->
    <text x="0" y="130" class="subtitle-text">Curated directory of SaaS enterprise leaders &amp; open-source mobile platforms</text>
    <text x="0" y="156" class="subtitle-text">Empowering field reps, sales pipelines, offline-first sync &amp; customer intelligence.</text>

    <!-- Live Metric Cards -->
    <g transform="translate(0, 185)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="160" height="66" rx="10" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2" />
      <text x="16" y="24" class="metric-title">MARKET SIZE</text>
      <text x="16" y="50" class="metric-value">$85B+ CAGR 12%</text>

      <!-- Card 2 -->
      <g transform="translate(175, 0)">
        <rect x="0" y="0" width="160" height="66" rx="10" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2" />
        <text x="16" y="24" class="metric-title">TOP REPOS</text>
        <text x="16" y="50" class="metric-value">58k+ ★ STARS</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(350, 0)">
        <rect x="0" y="0" width="175" height="66" rx="10" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2" />
        <text x="16" y="24" class="metric-title">CORE CAPABILITY</text>
        <text x="16" y="50" class="metric-value">Offline-First Sync</text>
      </g>
    </g>
  </g>

  <!-- Right Side Graphic: Stylized Mobile Device & CRM Pipeline UI (Foreground Graphic) -->
  <g class="floating-phone" transform="translate(930, 35)">
    <!-- Device Frame -->
    <rect x="0" y="0" width="200" height="270" rx="32" fill="#0f172a" stroke="url(#phoneBorderGrad)" stroke-width="3" filter="url(#softGlow)" />
    
    <!-- Dynamic Island / Speaker -->
    <rect x="70" y="12" width="60" height="10" rx="5" fill="#1e293b" />

    <!-- Mobile Screen UI Mockup -->
    <g transform="translate(16, 36)">
      <!-- Top Bar -->
      <circle cx="10" cy="10" r="10" fill="#38bdf8" fill-opacity="0.2" />
      <text x="30" y="14" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#e2e8f0">Deal Pipeline</text>

      <!-- Pipeline Metric Card -->
      <rect x="0" y="30" width="168" height="52" rx="8" fill="url(#cardGrad2)" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1" />
      <text x="12" y="50" font-family="-apple-system, sans-serif" font-weight="500" font-size="11" fill="#94a3b8">Active Pipeline</text>
      <text x="12" y="70" font-family="-apple-system, sans-serif" font-weight="800" font-size="16" fill="#4ade80">$1,248,500</text>

      <!-- Mini Deal Rows -->
      <g transform="translate(0, 94)">
        <!-- Row 1 -->
        <rect x="0" y="0" width="168" height="38" rx="7" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
        <circle cx="16" cy="19" r="6" fill="#38bdf8" />
        <text x="32" y="17" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#f8fafc">Enterprise Pitch</text>
        <text x="32" y="30" font-family="-apple-system, sans-serif" font-weight="500" font-size="9" fill="#64748b">Closing: Tomorrow</text>
        <text x="126" y="24" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#38bdf8">$450k</text>

        <!-- Row 2 -->
        <g transform="translate(0, 46)">
          <rect x="0" y="0" width="168" height="38" rx="7" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
          <circle cx="16" cy="19" r="6" fill="#c084fc" />
          <text x="32" y="17" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#f8fafc">Global Logistics</text>
          <text x="32" y="30" font-family="-apple-system, sans-serif" font-weight="500" font-size="9" fill="#64748b">Offline sync active</text>
          <text x="128" y="24" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#c084fc">$185k</text>
        </g>
      </g>

      <!-- Bottom Nav Bar Indicator -->
      <line x1="50" y1="216" x2="118" y2="216" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>
</svg>
